name: remotescout
description: "RemoteScout — personal remote-job discovery and application assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_timezone: ^5.1.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  html: 0.15.6

flutter:
  uses-material-design: true
